[ContentBrowser]
ContentBrowserTab1.SelectedPaths=/Game/ThirdPersonBP

; Box 1.5 — the MCP server starts with the editor. The setting class is
; UCLASS(config=EditorPerProjectUserSettings), so this file is its committed home; without it the
; server only runs when the editor is launched with -ModelContextProtocolStartServer, which is why
; MCP appeared "broken" after the rebase (the old project had this in Saved/Config, which is not
; carried across projects). Both sections are set because the module-level check reads the Engine
; one and the plugin ships a settings class in each module.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True

[/Script/ModelContextProtocol.ModelContextProtocolSettings]
bAutoStartServer=True