ProjectName=Third Person BP Game Template

; Box 1.8's one line of ours. With no AbilitySystemGlobals section at all, GAS warns
; "No GameplayCueNotifyPaths were specified ... Falling back to using all of /Game/. This may be
; slow on large projects." and scans every asset in the project on every cue lookup. There are
; no cue assets here yet (zero GameplayCue hits in Source/, none in Content/), so this only
; removes the fallback before its cost grows with each asset the project gains.
; The old project's two extra paths (/Game/GameplayCues, /ShooterCore) and its custom
; AbilitySystemGlobalsClassName / GlobalGameplayCueManagerClass are NOT copied: those classes are
; Lyra-derived and are not ported, so they would not resolve in this project.
[/Script/GameplayAbilities.AbilitySystemGlobals]
+GameplayCueNotifyPaths=/Game/GameplayCueNotifies
