[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=5728C2E24C497C6D643E2C845FCE3E38
ProjectName=Third Person BP Game Template

; --- AbilitySystemGlobals: two lines of ours, both load-bearing ---
;
; 1) AbilitySystemGlobalsClassName. Every gameplay effect's context is allocated by
;    UAbilitySystemGlobals::AllocGameplayEffectContext(), and ours returns
;    FProsperitocracyGameplayEffectContext -- the type that carries the damage lines
;    (ProsperitocracyGameplayEffectContext.h, AddDamageLine) and the one that
;    UProsperitocracyDamageExecution reads back (ProsperitocracyDamageExecution.cpp:26).
;    Without this line the engine allocates a plain FGameplayEffectContext,
;    ExtractEffectContext returns null, and every damage line is silently dropped: the
;    pipeline would compile, run, and deal nothing at all. The old project set the same line.
;
; 2) GameplayCueNotifyPaths (box 1.8's one warning of ours). With no AbilitySystemGlobals
;    section at all, GAS warns "No GameplayCueNotifyPaths were specified ... Falling back to
;    using all of /Game/. This may be slow on large projects." and scans every asset in the
;    project on every cue lookup. There are no cue assets here yet (zero GameplayCue hits in
;    Source/, none in Content/), so this only removes the fallback before its cost grows.
;
; NOT copied from the old project: GlobalGameplayCueManagerClass (that cue layer was
; deliberately removed) and its two extra cue paths (/Game/GameplayCues, /ShooterCore --
; neither folder exists here).
[/Script/GameplayAbilities.AbilitySystemGlobals]
AbilitySystemGlobalsClassName=/Script/Prosperitocracy.ProsperitocracyAbilitySystemGlobals
+GameplayCueNotifyPaths=/Game/GameplayCueNotifies
